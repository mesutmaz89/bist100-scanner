name: BIST100 Scanner Bot

on:
  schedule:
    # Hafta içi (Pazartesi-Cuma) Türkiye saatiyle 09:00 - 18:00 arası her saat başı çalışır (UTC 06:00 - 15:00)
    - cron: '0 6-15 * * 1-5'
  workflow_dispatch: # İstediğin zaman GitHub paneli üzerinden de elle tetikleyebilmen için

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    steps:
      - name: Repositoriyi Kopyala
        uses: actions/checkout@v3

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Bağımlılıkları Yükle
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Tarayıcı Botu Çalıştır
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          python main.py
