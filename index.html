<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIST100 Sinyal & Portföy Paneli</title>

  <!-- PWA Meta Ayarları -->
  <meta name="theme-color" content="#0d1117">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="BIST100 Panel">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .card { background-color: #161b22; border: 1px solid #30363d; border-radius: 0.75rem; }
    .input-field { background-color: #0d1117; border: 1px solid #30363d; color: #f0f6fc; border-radius: 0.5rem; padding: 0.6rem 0.8rem; }
    .input-field:focus { outline: none; border-color: #58a6ff; }
  </style>

  <!-- Service Worker Kaydı -->
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('firebase-messaging-sw.js')
          .then(reg => console.log('Service Worker kayıt başarılı:', reg.scope))
          .catch(err => console.log('Service Worker kayıt hatası:', err));
      });
    }
  </script>
</head>
<body class="p-4 md:p-8 max-w-6xl mx-auto">

  <!-- Üst Başlık & Sekmeler (Orijinal Tasarım) -->
  <header class="flex flex-col md:flex-row justify-between items-center mb-6 gap-4">
    <div>
      <h1 class="text-2xl font-bold text-white flex items-center gap-2">
        <span class="w-3 h-3 rounded-full bg-emerald-500 inline-block animate-pulse"></span>
        BIST100 Sinyal Paneli
      </h1>
      <p id="last-update" class="text-xs text-gray-400 mt-1">Otomatik Tarama Aktif (Hafta içi saat başı)</p>
    </div>
    
    <!-- Sekme Butonları (Orijinal 3'lü Yapı) -->
    <div class="flex bg-[#161b22] p-1 rounded-xl border border-[#30363d] gap-1">
      <button onclick="switchTab('signals')" id="tab-signals" class="px-4 py-1.5 text-sm font-medium rounded-lg text-white bg-[#21262d]">Sinyaller</button>
      <button onclick="switchTab('history')" id="tab-history" class="px-4 py-1.5 text-sm font-medium rounded-lg text-gray-400 hover:text-white flex items-center gap-1.5">📊 Geçmiş</button>
      <button onclick="switchTab('portfolio')" id="tab-portfolio" class="px-4 py-1.5 text-sm font-medium rounded-lg text-gray-400 hover:text-white flex items-center gap-1.5">💼 Portföyüm</button>
    </div>
  </header>

  <!-- SİNYALLER SEKMESİ (Orijinal Kart Düzeni) -->
  <main id="view-signals" class="space-y-4">
    <div id="signals-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-8 text-gray-500 card">Sinyaller yükleniyor...</div>
    </div>
  </main>

  <!-- GEÇMİŞ SEKMESİ -->
  <main id="view-history" class="space-y-4 hidden">
    <div id="history-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
      <div class="col-span-full text-center py-8 text-gray-500 card">Geçmiş sinyaller yükleniyor...</div>
    </div>
  </main>

  <!-- PORTFÖY SEKMESİ -->
  <main id="view-portfolio" class="space-y-6 hidden">
    
    <!-- Toplam Özet Kartı -->
    <div class="card p-5 grid grid-cols-2 md:grid-cols-4 gap-4 border-l-4 border-l-blue-500">
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider">Maliyet Değeri</p>
        <p id="total-cost" class="text-lg font-bold text-white">0.00 TL</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider">Güncel Portföy</p>
        <p id="total-value" class="text-lg font-bold text-white">0.00 TL</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider">Net Kâr / Zarar</p>
        <p id="total-pnl" class="text-lg font-bold text-gray-400">0.00 TL</p>
      </div>
      <div>
        <p class="text-xs text-gray-400 uppercase tracking-wider">Toplam Getiri</p>
        <p id="total-pnl-pct" class="text-lg font-bold text-gray-400">%0.00</p>
      </div>
    </div>

    <!-- Pozisyon Ekle Formu -->
    <section class="card p-5">
      <h2 class="text-base font-semibold text-white mb-4 flex items-center gap-2">
        <i class="fa-solid fa-plus text-blue-400"></i> Yeni Pozisyon Ekle
      </h2>
      <form id="add-position-form" class="grid grid-cols-1 md:grid-cols-4 gap-3">
        <div>
          <input list="bist100-list" id="pos-ticker" type="text" placeholder="Hisse Ara (Örn: THYAO)" class="input-field w-full uppercase" required autocomplete="off">
          <datalist id="bist100-list">
            <option value="AKBNK">Akbank</option><option value="ALARK">Alarko Holding</option>
            <option value="ARCLK">Arçelik</option><option value="ASELS">Aselsan</option>
            <option value="BIMAS">BİM Mağazalar</option><option value="BRSAN">Borusan</option>
            <option value="DOAS">Doğuş Otomotiv</option><option value="EKGYO">Emlak Konut</option>
            <option value="ENKAI">Enka İnşaat</option><option value="EREGL">Ereğli Demir Çelik</option>
            <option value="FROTO">Ford Otosan</option><option value="GARAN">Garanti BBVA</option>
            <option value="GUBRF">Gübre Fabrikaları</option><option value="HEKTS">Hektaş</option>
            <option value="KCHOL">Koç Holding</option><option value="KONTR">Kontrolmatik</option>
            <option value="KOZAL">Koza Altın</option><option value="KRDMD">Kardemir D</option>
            <option value="MAVI">Mavi Giyim</option><option value="ODAS">Odaş Elektrik</option>
            <option value="OYAKC">Oyak Çimento</option><option value="PETKM">Petkim</option>
            <option value="PGSUS">Pegasus</option><option value="SAHOL">Sabancı Holding</option>
            <option value="SASA">Sasa Polyester</option><option value="SISE">Şişecam</option>
            <option value="TCELL">Turkcell</option><option value="THYAO">Türk Hava Yolları</option>
            <option value="TKFEN">Tekfen Holding</option><option value="TOASO">Tofaş Oto</option>
            <option value="TSKB">TSKB</option><option value="TTKOM">Türk Telekom</option>
            <option value="TUPRS">Tüpraş</option><option value="ULKER">Ülker Bisküvi</option>
            <option value="YKBNK">Yapı Kredi</option>
          </datalist>
        </div>
        <div>
          <input id="pos-price" type="number" step="0.01" placeholder="Alış Fiyatı (TL)" class="input-field w-full" required>
        </div>
        <div>
          <input id="pos-qty" type="number" step="1" placeholder="Adet" class="input-field w-full" required>
        </div>
        <button type="submit" class="bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 px-4 rounded-lg transition-colors">
          Pozisyonu Kaydet
        </button>
      </form>
    </section>

    <!-- Pozisyon Kartları Listesi -->
    <div id="positions-container" class="space-y-4">
      <div class="text-center py-8 text-gray-500">Pozisyonlar yükleniyor...</div>
    </div>
  </main>

  <!-- Firebase & Uygulama Mantığı -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, doc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getMessaging, getToken } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-messaging.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAUdkTkbut1KrO-IAOPGfAUG0fx0YCvY2A",
      authDomain: "bist100-scanner.firebaseapp.com",
      projectId: "bist100-scanner",
      storageBucket: "bist100-scanner.firebasestorage.app",
      messagingSenderId: "1034148308576",
      appId: "1:1034148308576:web:e6b5a87fa5d34a45924505"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const messaging = getMessaging(app);

    // BİLDİRİM İZNİ VE TOKEN KAYDI
    async function requestNotificationPermission() {
      try {
        const permission = await Notification.requestPermission();
        if (permission === 'granted') {
          const currentToken = await getToken(messaging, { 
            vapidKey: 'BIU1zZhwL4i81NZ2WWXnigRcS2RxY28bZZOkE4R72supv8TCLJcDymhjDajTMRMQYwIeIhKPnorjJJExHmlI5-c' 
          });

          if (currentToken) {
            await addDoc(collection(db, "fcm_tokens"), {
              token: currentToken,
              created_at: serverTimestamp()
            });
          }
        }
      } catch (err) {
        console.error("Bildirim izni hatası:", err);
      }
    }

    requestNotificationPermission();

    let currentPositions = [];
    let currentAlerts = {};
    let currentSignals = [];
    let historySignals = [];

    // Formatlayıcılar
    function safeNum(val) {
      const num = Number(val);
      return isNaN(num) ? null : num;
    }

    function formatMoney(val) {
      const n = safeNum(val);
      if (n === null) return "--- TL";
      return `${n.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 })} TL`;
    }

    function formatPercent(val) {
      const n = safeNum(val);
      if (n === null) return "%---";
      const sign = n > 0 ? "+" : "";
      return `${sign}%${n.toFixed(2)}`;
    }

    function getBadgeStyle(action) {
      switch (action) {
        case 'EXIT_ALL': case 'SAT': return 'bg-red-500/20 text-red-400 border-red-500/30';
        case 'TAKE_PROFIT_HALF': case 'AL': case 'AL (LONG)': return 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30';
        case 'BUY_MORE': return 'bg-amber-500/20 text-amber-400 border-amber-500/30';
        default: return 'bg-blue-500/20 text-blue-400 border-blue-500/30';
      }
    }

    // POZİSYON İŞLEMLERİ
    document.getElementById('add-position-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const rawTicker = document.getElementById('pos-ticker').value.trim().toUpperCase();
      const price = parseFloat(document.getElementById('pos-price').value);
      const qty = parseFloat(document.getElementById('pos-qty').value);

      if (!rawTicker || !price || !qty) return;

      try {
        await addDoc(collection(db, "user_positions"), {
          ticker: rawTicker,
          entry_price: price,
          quantity: qty,
          status: "OPEN",
          created_at: serverTimestamp()
        });
        document.getElementById('add-position-form').reset();
      } catch (err) {
        console.error("Pozisyon hatası:", err);
      }
    });

    window.closePosition = async (id) => {
      if (confirm("Bu pozisyonu kapatmak istediğinize emin misiniz?")) {
        try {
          await updateDoc(doc(db, "user_positions", id), { status: "CLOSED" });
        } catch (err) {
          console.error("Pozisyon kapatma hatası:", err);
        }
      }
    };

    // FIRESTORE DİNLEYİCİLERİ
    onSnapshot(collection(db, "user_positions"), (snapshot) => {
      currentPositions = [];
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.status === "OPEN") currentPositions.push({ id: docSnap.id, ...data });
      });
      renderPortfolio();
    });

    onSnapshot(collection(db, "portfolio_alerts"), (snapshot) => {
      currentAlerts = {};
      snapshot.forEach(docSnap => { currentAlerts[docSnap.id] = docSnap.data(); });
      renderPortfolio();
    });

    onSnapshot(collection(db, "signals"), (snapshot) => {
      currentSignals = [];
      historySignals = [];
      snapshot.forEach(docSnap => {
        const data = docSnap.data();
        if (data.status === 'CLOSED' || data.is_history === true) {
          historySignals.push(data);
        } else {
          currentSignals.push(data);
        }
      });
      renderSignals();
      renderHistory();
    });

    // KART ŞABLONU (Orijinal İlk Ekran Tasarımı)
    function createSignalCard(sig) {
      const signalType = sig.signal || sig.action || 'AL (LONG)';
      const riskLevel = sig.risk_level || sig.risk || 'MEDIUM';
      const entryPrice = sig.entry_price || sig.price || sig.current_price;
      const stopLoss = sig.stop_loss || sig.stop;
      const targetPrice = sig.target_price || sig.target || sig.hedef;
      const rrRatio = sig.risk_reward || sig.rr || '1:2';
      const reasoning = sig.reasoning || sig.description || 'ADX>20 trend güçlü, RSI sağlıklı bölgede, OBV yükseliyor';

      return `
        <div class="card p-5">
          <div class="flex justify-between items-center mb-4">
            <h3 class="text-xl font-bold text-white tracking-wide">${sig.ticker}</h3>
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-gray-400 tracking-wider">${riskLevel}</span>
              <span class="px-2.5 py-1 text-xs font-bold rounded-lg border ${getBadgeStyle(signalType)}">
                ${signalType}
              </span>
            </div>
          </div>

          <div class="bg-[#0d1117] p-3 rounded-lg border border-[#30363d] mb-4">
            <div class="grid grid-cols-4 gap-2 text-center">
              <div>
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Giriş</p>
                <p class="text-sm font-bold text-white">${formatMoney(entryPrice)}</p>
              </div>
              <div>
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Stop</p>
                <p class="text-sm font-bold text-red-400">${formatMoney(stopLoss)}</p>
              </div>
              <div>
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">Hedef</p>
                <p class="text-sm font-bold text-emerald-400">${formatMoney(targetPrice)}</p>
              </div>
              <div>
                <p class="text-[10px] text-gray-400 uppercase tracking-wider mb-1">R/R</p>
                <p class="text-sm font-bold text-white">${rrRatio}</p>
              </div>
            </div>
          </div>

          <p class="text-xs text-gray-400 leading-relaxed">${reasoning}</p>
        </div>
      `;
    }

    // SİNYALLERİ EKRANA ÇİZME
    function renderSignals() {
      const container = document.getElementById('signals-container');
      if (currentSignals.length === 0) {
        container.innerHTML = `<div class="col-span-full card p-8 text-center text-gray-400">Henüz yayınlanmış aktif sinyal bulunmuyor.</div>`;
        return;
      }

      let html = '';
      currentSignals.forEach(sig => { html += createSignalCard(sig); });
      container.innerHTML = html;
    }

    // GEÇMİŞİ EKRANA ÇİZME
    function renderHistory() {
      const container = document.getElementById('history-container');
      if (historySignals.length === 0) {
        container.innerHTML = `<div class="col-span-full card p-8 text-center text-gray-400">Geçmiş sinyal kaydı bulunmuyor.</div>`;
        return;
      }

      let html = '';
      historySignals.forEach(sig => { html += createSignalCard(sig); });
      container.innerHTML = html;
    }

    // PORTFÖYÜ EKRANA ÇİZME
    function renderPortfolio() {
      const container = document.getElementById('positions-container');
      if (currentPositions.length === 0) {
        container.innerHTML = `<div class="card p-8 text-center text-gray-400">Henüz açık bir pozisyonunuz bulunmuyor. Formu kullanarak ekleyebilirsiniz.</div>`;
        updateSummary(0, 0);
        return;
      }

      let totalCost = 0;
      let totalValue = 0;
      let html = '';

      currentPositions.forEach(pos => {
        const alert = currentAlerts[pos.id] || {};
        const cost = pos.entry_price * pos.quantity;
        const currentPrice = safeNum(alert.current_price);
        const val = currentPrice !== null ? currentPrice * pos.quantity : cost;

        totalCost += cost;
        totalValue += val;

        const pnlPct = safeNum(alert.pnl_pct);
        const pnlAmount = safeNum(alert.pnl_amount);
        const pnlColor = pnlPct !== null && pnlPct >= 0 ? 'text-emerald-400' : (pnlPct !== null ? 'text-red-400' : 'text-gray-400');
        const badgeStyle = getBadgeStyle(alert.action);

        html += `
          <div class="card p-5 relative">
            <button onclick="closePosition('${pos.id}')" title="Pozisyonu Sil" class="absolute top-4 right-4 text-gray-500 hover:text-red-400 transition-colors">
              <i class="fa-solid fa-trash-can"></i>
            </button>
            <div class="flex items-center gap-3 mb-4">
              <h3 class="text-xl font-bold text-white">${pos.ticker}</h3>
              <span class="px-2.5 py-0.5 text-xs font-semibold rounded-full border ${badgeStyle}">
                ${alert.action || 'BEKLENİYOR'}
              </span>
              <span class="text-xs text-gray-400">${pos.quantity} Adet</span>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center bg-[#0d1117] p-3 rounded-lg border border-[#30363d] mb-3">
              <div>
                <p class="text-xs text-gray-400">Maliyet</p>
                <p class="font-bold text-white">${formatMoney(pos.entry_price)}</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">Güncel Fiyat</p>
                <p class="font-bold text-white">${formatMoney(alert.current_price)}</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">K/Z (%)</p>
                <p class="font-bold ${pnlColor}">${formatPercent(pnlPct)}</p>
              </div>
              <div>
                <p class="text-xs text-gray-400">İz Süren Stop</p>
                <p class="font-bold text-amber-400">${formatMoney(alert.trailing_stop_price)}</p>
              </div>
            </div>

            <div class="flex justify-between items-center text-xs text-gray-400">
              <p>${alert.reasoning || 'Analiz verisi yükleniyor...'}</p>
              <p class="${pnlColor} font-semibold">Net K/Z: ${formatMoney(pnlAmount)}</p>
            </div>
          </div>
        `;
      });

      container.innerHTML = html;
      updateSummary(totalCost, totalValue);
    }

    function updateSummary(cost, value) {
      const pnl = value - cost;
      const pct = cost > 0 ? (pnl / cost) * 100 : 0;
      const color = pnl >= 0 ? 'text-emerald-400' : 'text-red-400';

      document.getElementById('total-cost').innerText = formatMoney(cost);
      document.getElementById('total-value').innerText = formatMoney(value);
      
      const pnlElem = document.getElementById('total-pnl');
      pnlElem.innerText = formatMoney(pnl);
      pnlElem.className = `text-lg font-bold ${color}`;

      const pctElem = document.getElementById('total-pnl-pct');
      pctElem.innerText = formatPercent(pct);
      pctElem.className = `text-lg font-bold ${color}`;
    }

    // SEKME GEÇİŞLERİ (3'lü Sekme Yapısı)
    window.switchTab = (tab) => {
      const btnSignals = document.getElementById('tab-signals');
      const btnHistory = document.getElementById('tab-history');
      const btnPortfolio = document.getElementById('tab-portfolio');

      const viewSignals = document.getElementById('view-signals');
      const viewHistory = document.getElementById('view-history');
      const viewPortfolio = document.getElementById('view-portfolio');

      // Bütün sekmeleri pasif yap
      [btnSignals, btnHistory, btnPortfolio].forEach(btn => {
        btn.className = "px-4 py-1.5 text-sm font-medium rounded-lg text-gray-400 hover:text-white flex items-center gap-1.5";
      });
      [viewSignals, viewHistory, viewPortfolio].forEach(view => {
        view.classList.add('hidden');
      });

      // Seçileni aktif yap
      if (tab === 'history') {
        btnHistory.className = "px-4 py-1.5 text-sm font-medium rounded-lg text-white bg-[#21262d] flex items-center gap-1.5";
        viewHistory.classList.remove('hidden');
      } else if (tab === 'portfolio') {
        btnPortfolio.className = "px-4 py-1.5 text-sm font-medium rounded-lg text-white bg-[#21262d] flex items-center gap-1.5";
        viewPortfolio.classList.remove('hidden');
      } else {
        btnSignals.className = "px-4 py-1.5 text-sm font-medium rounded-lg text-white bg-[#21262d]";
        viewSignals.classList.remove('hidden');
      }
    };
  </script>
</body>
</html>
